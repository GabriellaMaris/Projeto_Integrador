<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação | Apoia+</title>
    <link rel="stylesheet" href="doacao.css">
</head>
<body>
    <div class="container">
        <div class="form-image">
            <img src="img/íconeDOE.png" alt="Doação" draggable="false">
        </div>

        <div class="form">
            <div class="form-header">
                <div class="title">
                    <h1>Faça sua Doação</h1>
                </div>
            </div>

            <form action="#">
                <div class="input-group">
                    <div class="input-box">
                        <label for="valor">Valor da Doação</label>
                        <input id="valor" type="number" name="valor" placeholder="Digite o valor (R$)" required>
                    </div>

                    <div class="input-box valores-rapidos">
                        <label>Valores Rápidos</label>
                        <div class="botoes-valores">
                            <button type="button">R$10</button>
                            <button type="button">R$20</button>
                            <button type="button">R$50</button>
                            <button type="button">R$100</button>
                        </div>
                    </div>

                    <div class="input-box">
                        <label>Forma de Pagamento</label>
                        <div class="pagamento-group">
                            <label><input type="radio" name="pagamento" value="pix"> Pix</label>
                            <label><input type="radio" name="pagamento" value="credito"> Crédito</label>
                            <label><input type="radio" name="pagamento" value="debito"> Débito</label>
                        </div>
                    </div>

                    <div class="input-box">
                        <label>Frequência da Doação</label>
                        <select name="frequencia" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="mensal">Mensal</option>
                            <option value="trimestral">Trimestral</option>
                            <option value="semestral">Semestral</option>
                            <option value="anual">Anual</option>
                            <option value="unica">Apenas uma vez</option>
                        </select>
                    </div>
                </div>

                <div class="continue-button">
                    <button type="submit">Confirmar Doação</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Preenche o campo de valor ao clicar nos botões rápidos
        const botoes = document.querySelectorAll('.botoes-valores button');
        const inputValor = document.getElementById('valor');
        botoes.forEach(botao => {
            botao.addEventListener('click', () => {
                const valor = botao.textContent.replace('R$', '');
                inputValor.value = valor;
            });
        });

        // Impede valores negativos e força mínimo de 5
        inputValor.addEventListener('input', () => {
            if (inputValor.value < 5) {
                inputValor.value = 5;
            }
        });

        // Cria o pop-up
        const popup = document.createElement('div');
        popup.className = 'popup';
        popup.innerHTML = `
            <div class="popup-content">
                <h2>🎉 Obrigado pela sua doação!</h2>
                <p>Seu apoio ajuda a transformar vidas 💜</p>
                <button id="closePopup">Fechar</button>
            </div>
        `;
        document.body.appendChild(popup);

        // Mostra o pop-up ao confirmar
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (inputValor.value >= 5) {
                popup.style.display = 'flex';
            }
        });

        // Fecha o pop-up
        document.body.addEventListener('click', (e) => {
            if (e.target.id === 'closePopup' || e.target === popup) {
                popup.style.display = 'none';
                form.reset();
            }
        });
    </script>
</body>
</html>
